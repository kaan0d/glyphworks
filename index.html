<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glyphworks</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #cfd3dc; font: 14px/1.6 ui-monospace, Consolas, monospace; }
      main { min-height: 100%; display: grid; place-content: center; padding: 24px; }
      h1 { margin: 0 0 20px; font-weight: 300; letter-spacing: 0.3em; font-size: 15px; color: #8a90a0; }
      a { color: #f2f5fb; text-decoration: none; display: block; padding: 4px 0; letter-spacing: 0.08em; }
      a:hover { text-shadow: 0 0 12px rgba(200, 215, 255, 0.9); }
      a span { color: #6b7080; margin-left: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>GLYPHWORKS</h1>
      <!-- one line per work -->
      <a href="./works/heart/">heart<span>hollow inflated heart balloon</span></a>
    </main>
  </body>
</html>
